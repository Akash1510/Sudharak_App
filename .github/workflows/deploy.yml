name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}

          script: |
            cd ~/Sudharak_App

            echo "Pull latest code"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env

            echo "Install Node dependencies"
            cd backend/Authentication
            npm install

            cd ../Report_Interaction
            npm install

            echo "Install Python dependencies"
            cd ../flask-backend
            python3 -m venv venv || true
            source venv/bin/activate
            pip install -r requirements.txt
            pip install gunicorn


             echo "Restart Kafka service"

            sudo systemctl restart kafka

            echo "Waiting for Kafka to become ready..."

            for i in {1..12}; do
              nc -z 127.0.0.1 9092 && echo "Kafka is ready!" && break
              echo "Kafka not ready yet... retrying in 5 seconds"
              sleep 5
            done

            echo "Checking Kafka port"

            nc -zv 127.0.0.1 9092

            echo "Restart PM2 services"

            pm2 restart all

            echo "Save PM2 process list"

            pm2 save

            echo "Deployment completed successfully"
